services:

  api:
    build: ./API
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    env_file:
      - ./env/.env
    volumes:
      - ./API:/app

  db:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: Pass
      MYSQL_DATABASE: dbdatacoms
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    
  celery:
    build: ./API
    command: celery -A worker.celery_app worker -l info
    depends_on:
      - db
      - redis
    env_file:
      - ./env/.env
    volumes:
      - ./API:/app


  redis:
    image: redis
    ports:
      - "6379:6379"
  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment: 
      - "REDIS_HOSTS=local:redis:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
  nginx:
   
    build: ./NGINX
    ports:
      - "80:80"
      - "1935:1935"
    volumes:
      - ./NGINX/nginx.conf:/etc/nginx/nginx.conf
      #- ./hls:/tmp/hls
    depends_on:
      - api
      - minio
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
   
  

    

   

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local