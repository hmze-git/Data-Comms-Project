services:

  api:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: Pass
      MYSQL_DATABASE: dbdatacoms
    ports:
      - "3307:3306"

    
  celery:
    build: .
    command: celery -A celery.tasks worker -l info
    depends_on:
      - db
      - redis

  redis:
    image: redis
    ports:
      - "6379:6379"
  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment: 
      - "REDIS_HOSTS=local:redis:6379"

  